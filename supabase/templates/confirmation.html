<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f7f9fc; color: #333333; line-height: 1.6; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e9ecef; }
    .header { background-color: #4361ee; background-image: linear-gradient(135deg, #4361ee, #3a0ca3); padding: 30px 20px; text-align: center; color: white; }
    .header h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .content { padding: 40px 30px; text-align: center; }
    .content p { font-size: 16px; color: #495057; margin-bottom: 24px; }
    .btn { display: inline-block; padding: 14px 28px; background-color: #4cc9f0; color: #ffffff !important; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 16px; box-shadow: 0 4px 10px rgba(76, 201, 240, 0.3); transition: all 0.2s; }
    .footer { background-color: #f8f9fa; padding: 20px 30px; text-align: center; border-top: 1px solid #e9ecef; }
    .footer p { margin: 0; font-size: 13px; color: #adb5bd; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Teachy Time</h1>
    </div>
    <div class="content">
      <h2 style="margin-top: 0; color: #2b2d42; font-size: 22px;">Welcome to Teachy Time! 🎉</h2>
      <p>We're thrilled to have you! Please confirm your email address to verify your account so you can start organizing your schedule.</p>
      
      <a href="{{ .ConfirmationURL }}" class="btn">Confirm Email Address</a>
    </div>
    <div class="footer">
      <p>&copy; 2026 Teachy Time. Need help? Contact our support team.</p>
    </div>
  </div>
</body>
</html>
