# A string used to distinguish different Supabase projects on the same host.
project_id = "teachy-time"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
svr_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 3001

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external]

[realtime]
enabled = true

[storage]
enabled = true

[functions]
enabled = true

[analytics]
enabled = false
